<link rel="manifest" href="manifest.webmanifest">

<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; } /* o jogo tem um visual só (fundo escuro de estojo), nos dois temas */
  html, body { margin: 0; height: 100%; background: #1d1916; overflow: hidden; }
  /* toque: nada de rolar, dar zoom, selecionar texto ou piscar ao tocar */
  html, body, canvas { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; border-radius: 6px; box-shadow: 0 18px 50px rgba(0,0,0,0.5); }
  /* celular em pé: o jogo é deitado */
  #gire { display: none; position: fixed; inset: 0; z-index: 5; background: #1d1916; color: #f1bf3a;
    flex-direction: column; align-items: center; justify-content: center; text-align: center;
    font: 34px "Luckiest Guy", "Arial Black", sans-serif; }
  #gire span { margin-top: 12px; font: 22px "Patrick Hand", "Comic Sans MS", sans-serif; color: #fbf7ec; }
  @media (orientation: portrait) and (pointer: coarse) { #gire { display: flex; } }
</style>
</head>

<canvas id="jogo"></canvas>
<div id="gire">↻ Gire o celular<span>The Lost Kings se joga com a tela deitada</span></div>
